<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F0ECE5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="50"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-positioning-route"
        class="scene"
        data-composition-id="02-positioning-route"
        data-composition-src="compositions/frames/02-positioning-route.html"
        data-start="5"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-beijing"
        class="scene"
        data-composition-id="03-beijing"
        data-composition-src="compositions/frames/03-beijing.html"
        data-start="12"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-shanghai"
        class="scene"
        data-composition-id="04-shanghai"
        data-composition-src="compositions/frames/04-shanghai.html"
        data-start="18"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-05-shenzhen"
        class="scene"
        data-composition-id="05-shenzhen"
        data-composition-src="compositions/frames/05-shenzhen.html"
        data-start="26"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-included"
        class="scene"
        data-composition-id="06-included"
        data-composition-src="compositions/frames/06-included.html"
        data-start="34"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-07-climax"
        class="scene"
        data-composition-id="07-climax"
        data-composition-src="compositions/frames/07-climax.html"
        data-start="38"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="43"
        data-duration="7"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-positioning-route", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-05-shenzhen", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.fromTo("#el-06-included", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.to("#el-07-climax", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.to({}, { duration: 50 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
