      tl.fromTo(

        ["#sh-city-kicker", "#sh-city-label", "#sh-city-underline"],
        { opacity: 0, duration: 0.35, ease: "power1.out" },
        1.0,
      );

      // Scene 2 (1.0-6.5s): five brand cards cascade top-left -> bottom-right into a
      // 2-row grid, waterfall entry with a tightening overlap each beat (accelerating
      // rhythm = "more, faster"), each settling with a spring-pop.

        "#sh-card-agibot",
        { y: 46, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" },

        2.7,

        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.35)" },
        3.4,

        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.3)" },
