  <script>
    (function () {
      function build() {
        var scopeEl = document.querySelector('[data-composition-id="08-cta"]');
        var wordmark = scopeEl.querySelector(".cta08-wordmark");
        var tagline = scopeEl.querySelector(".cta08-tagline");
        var accentLine = scopeEl.querySelector(".cta08-accent-line");
        var rings = scopeEl.querySelectorAll(".cta08-ring");
        var pillWrap = scopeEl.querySelector(".cta08-pill-wrap");
        var pill = scopeEl.querySelector(".cta08-pill");
        var cursor = scopeEl.querySelector(".cta08-cursor");
        var glow = scopeEl.querySelector(".cta08-glow");

        var WORD_HOLD_Y = 640;
        var WORD_CONDENSE_Y = 480;
        var TAGLINE_REST_Y = 660;

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.4s): hard cut to the brand white ground. "GLOBAL TECH TOUR"
        // wordmark (promoted from Frame 2) holds dead-center, alive but resting — faint
        // rotational breath only.
        tl.fromTo(
          wordmark,
          { opacity: 0, scale: 0.94, y: WORD_HOLD_Y },
          { opacity: 1, scale: 1, y: WORD_HOLD_Y, duration: 0.25, ease: "power2.out" },
          0
        );
        tl.fromTo(
          accentLine,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" },
          0.05
        );
        tl.fromTo(
          wordmark,
          { rotation: -0.6 },
          { rotation: 0.6, duration: 1.0, ease: "sine.inOut" },
          0.3
        );
        // (breath ends at 1.3 — a clear 0.1s gap precedes the next rotation tween on the
        // same target below, avoiding a zero-duration touch between them)

        // Scene 2 (1.4-2.6s): the wordmark CONDENSES at the same center into "ROBOTICS
        // EXPEDITION" locking underneath it in label weight — one continuous transform,
        // shared transform-origin. Settled rest positions keep a clear vertical gap so the
        // two rows never visually overlap.
        tl.to(
          wordmark,
          { scale: 0.42, y: WORD_CONDENSE_Y, rotation: 0, duration: 0.6, ease: "power3.inOut" },
          1.4
        );
        tl.fromTo(
          tagline,
          { opacity: 0, y: TAGLINE_REST_Y + 40 },
          { opacity: 1, y: TAGLINE_REST_Y, duration: 0.55, ease: "power2.out" },
          1.85
        );

        // Scene 3 (2.6-4.0s): the solid electric-iris pill CTA scales up from the same
        // center, holding the real contact. A cursor arrives from off-stage on a
        // decelerating path (x/y transform only — never left/top strings), landing a few
        // px off the pill's geometric center.
        tl.fromTo(
          pillWrap,
          { opacity: 0, scale: 0.18 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
          2.6
        );
        tl.fromTo(
          rings,
          { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" },
          2.6
        );
        tl.fromTo(
          cursor,
          { x: 420, y: 260 },
          { x: 0, y: 0, duration: 0.82, ease: "power3.out" },
          3.0
        );

        // Scene 4 (4.0-7.0s): cursor lands a physical click — pill and cursor compress
        // together, then release with a soft glow-bloom; everything holds static and
        // legible to the final frame (last frame — no exit).
        var CLICK = 4.0;
        var GAP = 0.03;

        tl.to(cursor, { scale: 0.82, duration: 0.1, ease: "power2.in" }, CLICK);
        tl.to(cursor, { scale: 1, duration: 0.22, ease: "power2.out" }, CLICK + 0.1 + GAP);

        tl.to(pill, { scale: 0.93, duration: 0.1, ease: "power2.in" }, CLICK);
        tl.to(pill, { scale: 1.03, duration: 0.16, ease: "power2.out" }, CLICK + 0.1 + GAP);
        tl.to(pill, { scale: 1, duration: 0.18, ease: "power2.out" }, CLICK + 0.1 + GAP + 0.16 + GAP);

        tl.fromTo(
          glow,
          { opacity: 0, scale: 0.55 },
          { opacity: 0.6, scale: 1, duration: 0.35, ease: "power2.out" },
          CLICK - 0.1
        );
        tl.to(
          glow,
          { opacity: 0.24, scale: 1.18, duration: 0.65, ease: "power2.out" },
          CLICK - 0.1 + 0.35 + GAP
        );

        return tl;
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["08-cta"] = build();
    })();
  </script>
