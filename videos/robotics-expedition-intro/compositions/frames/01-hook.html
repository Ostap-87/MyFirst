<template data-composition-id="01-hook" data-duration="5.5">
<div id="root" data-composition-id="01-hook" data-width="1080" data-height="1920">
  <style>
    @font-face {
      font-family: "Rubik";
      font-weight: 900;
      font-style: normal;
      src: url("assets/fonts/rubik-latin-900-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Rubik";
      font-weight: 900;
      font-style: normal;
      src: url("assets/fonts/rubik-cyrillic-900-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Rubik";
      font-weight: 400;
      font-style: normal;
      src: url("assets/fonts/rubik-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Rubik";
      font-weight: 400;
      font-style: normal;
      src: url("assets/fonts/rubik-cyrillic-400-normal.woff2") format("woff2");
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      container-type: size;
      overflow: hidden;
      font-family: "Rubik", sans-serif;
    }

    .hook01-clip-bg {
      position: absolute;
      inset: 0;
      background: #111111; /* colors.ink-black */
    }

    .hook01-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5.5cqh;
      padding: 0 10cqw;
    }

    .hook01-number-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
    }

    .hook01-number {
      font-family: "Rubik", sans-serif;
      font-weight: 900;
      font-size: 34cqw;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: #e85d26; /* colors.fire-orange */
      opacity: 0;
      display: inline-block;
      transform-origin: 50% 65%;
      font-variant-numeric: tabular-nums;
    }

    .hook01-percent {
      font-family: "Rubik", sans-serif;
      font-weight: 900;
      font-size: 15cqw;
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: #e85d26; /* colors.fire-orange */
      opacity: 0;
      display: inline-block;
      transform-origin: 0% 100%;
      margin-left: 1.2cqw;
    }

    .hook01-caption {
      font-family: "Rubik", sans-serif;
      font-weight: 400;
      font-size: 4.2cqw;
      line-height: 1.5;
      color: #f0ece5; /* colors.cream */
      text-align: center;
      max-width: 78cqw;
      opacity: 0;
    }
  </style>

  <div class="clip hook01-clip-bg" data-start="0" data-duration="5.5" data-track-index="0"></div>

  <div class="hook01-stage">
    <div class="hook01-number-wrap">
      <span id="hook01-number" class="hook01-number">0</span><span id="hook01-percent" class="hook01-percent">%</span>
    </div>
    <div id="hook01-caption" class="hook01-caption">мирового рынка роботов — в Китае</div>
  </div>

  <script>
    (function () {
      var rootEl = document.querySelector('[data-composition-id="01-hook"]');
      var numberEl = rootEl.querySelector("#hook01-number");
      var percentEl = rootEl.querySelector("#hook01-percent");
      var captionEl = rootEl.querySelector("#hook01-caption");

      var counter = { value: 0 };

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.6s): pure ink-black field, nothing on screen — held silence.
      // (number/percent/caption start hidden via CSS; nothing to tween here.)

      // Scene 2 (0.6-3.2s): "86" explodes up from small-and-centered to full size in
      // fire-orange, counting 0->86 on the same beat as the scale grows (one spring-pop
      // ease); the "%" glyph locks beside it at final size right after.
      tl.to(
        numberEl,
        { opacity: 1, duration: 0.12, ease: "none" },
        0.6
      );
      tl.fromTo(
        numberEl,
        { scale: 0.12 },
        {
          scale: 1,
          duration: 1.7,
          ease: "back.out(1.6)",
          onUpdate: function () {
            var p = this.progress();
            counter.value = Math.round(gsap.utils.interpolate(0, 86, p));
            numberEl.textContent = String(counter.value);
          },
        },
        0.6
      );

      tl.fromTo(
        percentEl,
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" },
        2.35
      );

      // Held beat: number + "%" stay fully still through the rest of Scene 2's window
      // (2.7s -> 3.2s) — no breathing, no drift.

      // Scene 3 (3.2-5.0s): the claim locks in cream directly underneath, fading up once,
      // then the frame holds to the cut.
      tl.fromTo(
        captionEl,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        3.3
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</div>
</template>
