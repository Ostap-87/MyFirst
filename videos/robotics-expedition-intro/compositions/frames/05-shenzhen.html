  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.0s): city label hard-cuts in, cobalt eyebrow + underline draw in.
      tl.fromTo(
        "#sz-city-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "none" },
        0.0,
      );
      tl.fromTo(
        "#sz-city-label",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "none" },
        0.05,
      );
      tl.fromTo(
        "#sz-city-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.75, ease: "power2.out" },
        0.15,
      );

      // Recede to 0 opacity before the cards cascade in, so the city label never
      // visually overlaps the card grid content (avoids a content-overlap layout error).
      tl.to(
        ["#sz-city-eyebrow", "#sz-city-label", "#sz-city-underline"],
        { opacity: 0, duration: 0.35, ease: "power1.out" },
        1.0,
      );

      // Scene 2 (1.0-6.5s): five brand cards cascade into the 2-row grid, waterfall-entry
      // style, whipping in from below with binary opacity and an accelerating rhythm
      // (matches the card-pop x5 accelerating sfx / same fast cadence as Frame 4).
      var cascade = [
        { id: "#sz-card-ubtech", start: 1.00 },
        { id: "#sz-card-leju", start: 1.30 },
        { id: "#sz-card-limx", start: 1.55 },
        { id: "#sz-card-engineai", start: 1.75 },
        { id: "#sz-card-pudu", start: 1.90 },
      ];
      cascade.forEach(function (c) {
        tl.set(c.id, { opacity: 1 }, c.start);
        tl.fromTo(
          c.id,
          { y: 48 },
          { y: 0, duration: 0.16, ease: "power4.out" },
          c.start,
        );
      });

      // Scene 3 (6.5-8.0s): grid holds still. In the final ~0.5s a small "12"
      // ghost-counter briefly ticks up in the corner (12 cards seen across
      // Frames 3-5 combined) -- a quiet bridge into Frame 7's climax number.
      tl.fromTo(
        "#sz-counter",
        { opacity: 0 },
        { opacity: 0.7, duration: 0.15, ease: "power2.out" },
        7.5,
      );
      var counterProxy = { val: 9 };
      tl.to(
        counterProxy,
        {
          val: 12,
          duration: 0.4,
          ease: "power1.inOut",
          onUpdate: function () {
            var el = document.getElementById("sz-counter-num");
            if (el) el.textContent = Math.round(counterProxy.val);
          },
        },
        7.55,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["05-shenzhen"] = tl;
    })();
