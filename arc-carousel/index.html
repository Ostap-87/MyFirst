<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Carousel Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="arc-gallery" id="arcGallery">
  <div class="arc-track" id="arcTrack">
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#ff5f6d,#7c1a2c)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#8ee08a,#1f5c3a)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#f7c948,#8a5a00)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#5ec6e8,#0e3b57)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#c98bf0,#4a1a63)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#ff9770,#7a2b0e)"></div></div>
    <div class="arc-card"><div class="arc-img" style="background:linear-gradient(160deg,#6fe3c0,#0d4a3c)"></div></div>
  </div>

  <!-- To use real photos instead, replace each .arc-img div with:
       <img class="arc-img" src="your-photo.jpg" alt=""> -->
</div>

<script src="script.js"></script>
</body>
</html>
