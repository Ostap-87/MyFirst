<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      /* Шрифт из проекта Remotion, а не тот, что кладёт навык: его
         Inter-400-latin.woff2 без кириллицы, на русском были бы квадраты. */
      @font-face {
        font-family: "Inter";
        src: url("./fonts/Inter.ttf") format("truetype");
        font-weight: 100 900;
        font-display: block;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #000;
      }
      #root { width: 100%; height: 100%; position: relative; }

      #video-wrap { position: absolute; inset: 0; }
      #video-wrap video {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }

      /* ——— Геометрия взята из ChinaStories, а не подобрана заново ———

         LOGO_TOP 0.135 → 259px: ниже строки профиля сторис.
         MARKS_TOP 0.225 → 432px: ниже логотипа со всей его высотой.

         Сверху — только знак: там свободно во всех роликах. */
      /* Верхняя вуаль: знак белым по небу давал 1,57:1, аудит контраста
         это поймал. Одной тени мало — небо ярче неё. Градиент гасит верх
         кадра и на тёмном фоне не читается как плашка. */
      #scrim {
        position: absolute; top: 0; left: 0; right: 0; height: 560px;
        background: linear-gradient(
          to bottom,
          rgba(4, 8, 16, 0.62) 0%,
          rgba(4, 8, 16, 0.38) 52%,
          rgba(4, 8, 16, 0) 100%
        );
        pointer-events: none;
      }
      #brand {
        position: absolute; top: 259px; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center;
        gap: 22px;
      }
      #brand canvas { width: 113px; height: 113px; display: block; }
      #brand .wordmark {
        font-family: "Inter", sans-serif;
        font-weight: 700; font-size: 39px; letter-spacing: 4.3px;
        color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      /* Плашки внизу. Замер по всем шестнадцати исходникам: подбородок
         стоит между 1440 и 1540, а строка ответа сторис начинается на 1670.
         В худшем ролике остаётся около 130 пикселей — поэтому плашка
         однострочная и низкая, нижний край на 1660. Двухстрочная или с
         числом в столбик где-нибудь обязательно наедет на лицо. */
      /* ——— Накопительный список ———

         Стиль перенесён из PlateView в ChinaStories: белая плашка с тёмным
         текстом, у акцентной слева синяя полоса, зачёркнутая уходит в тёмное
         и перечёркивается красной чертой. Размеры те же долями кадра:
         кегль 0,044 → 47, скругление 0,014 → 15, поля 0,016 / 0,028.

         Плашки копятся в колонку и держатся до своего until. Стопка стоит
         сразу под логотипом и кончается на 640 — это линия волос в самом
         тесном из роликов. Больше трёх плашек одновременно туда не влезает. */
      #stack {
        position: absolute;
        top: 390px; left: 86px; right: 86px;
        display: flex; flex-direction: column;
        align-items: flex-start; gap: 14px;
      }
      .plate {
        position: relative;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 15px;
        padding: 14px 26px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.38);
        font-family: "Inter", sans-serif;
        font-weight: 700; font-size: 42px; letter-spacing: -0.8px;
        color: #17171d;
        white-space: nowrap;
        opacity: 0;
      }
      .plate.accent { border-left: 9px solid #2563eb; }
      .plate.struck {
        background: rgba(12, 16, 24, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: rgba(255, 255, 255, 0.86);
      }
      /* Черта рисуется от нуля вправо: зачёркивание должно читаться как
         действие, а не как заранее перечёркнутый текст. */
      .plate .strike {
        position: absolute; left: 26px; top: 52%;
        height: 5px; width: 0;
        background: #ff6b6b; border-radius: 3px;
      }

      .card {
        position: absolute;
        bottom: 260px; left: 86px; right: 86px;
        display: flex; align-items: flex-end;
      }
      .panel {
        background: rgba(7, 10, 17, 0.84);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 18px 28px;
        font-family: "Inter", sans-serif;
        color: #fff;
        opacity: 0;
        display: flex; align-items: center; gap: 20px;
      }
      /* Число живёт внутри плашки, а не отдельно на съёмке: так оно не
         может оказаться на лице и не требует своей подложки. */
      .num {
        font-weight: 800; font-size: 54px; line-height: 1;
        color: #8fd4ff; letter-spacing: -0.02em;
      }
      .lines { font-weight: 700; font-size: 44px; line-height: 1.1; letter-spacing: -1.1px; white-space: nowrap; }
      /* Вторая часть теперь в строку, а не блоком: две строки в 134 пикселя не влезают. */
      .lines .second { color: #8fd4ff; }
      .lines .detail {
        display: block; font-size: 30px; font-weight: 500;
        line-height: 1.28; color: #ccd6e4; margin-top: 12px; letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="__DURATION__"
    >
      <!-- Съёмка идёт целиком и нетронутой. Время стоит на самом <video>:
           фреймворк владеет воспроизведением и требует разметку на медиа,
           а обёртка остаётся обычным слоем — иначе он ругается на
           вложенный тайминг. -->
      <div id="video-wrap">
        <video
          id="head"
          src="./media/head.mp4"
          data-start="0"
          data-duration="__DURATION__"
          data-track-index="0"
          data-has-audio="true"
        ></video>
      </div>

      <!-- Вуаль и фирменный блок обязаны быть размеченными клипами.
           Без data-start они видны в предпросмотре, но в готовый рендер
           не попадают: движок рисует только то, что стоит на таймлайне.
           Поймано сравнением кадра из файла с кадром из снапшота. -->
      <div id="scrim" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="3"></div>

      <!-- Фирменный блок: тетраэдр и знак, как в остальных сторис. -->
      <div id="brand" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="4">
        <canvas id="tetra" width="113" height="113"></canvas>
        <span class="wordmark">GLOBAL TECH TOUR</span>
      </div>

      <div id="stack">
__PLATES__
      </div>

__CARDS__
    </div>

    <script type="module">
      // three лежит рядом, а не тянется с CDN: браузер рендера не доверяет
      // сертификату прокси, да и рендер не должен зависеть от сети.
      import * as THREE from "./vendor/three.module.js";

      /**
       * Знак GlobalTechTour — настоящий тетраэдр на three.js.
       *
       * На сайте он тоже на three.js. В Remotion этот же знак пришлось
       * считать вручную и рисовать в SVG: в headless-браузере рендера нет
       * аппаратного ускорения, WebGL выходил втрое дороже за кадр и
       * переставал быть побитово одинаковым от прогона к прогону. Здесь
       * временем управляет движок через hf-seek, поэтому кадр
       * воспроизводим и WebGL допустим.
       *
       * Цвета те же, что в нашем компоненте: грани #61CBFA, рёбра #1E5FD0,
       * прозрачность граней 0,62 — сняты пипеткой со скриншота сайта.
       */
      const canvas = document.getElementById("tetra");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(113, 113, false);
      renderer.setPixelRatio(1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      camera.position.set(0, 0, 5.2);

      const geometry = new THREE.TetrahedronGeometry(1.35, 0);
      const faces = new THREE.Mesh(
        geometry,
        new THREE.MeshBasicMaterial({
          color: 0x61cbfa,
          transparent: true,
          opacity: 0.38,
          side: THREE.DoubleSide,
          depthWrite: false,
        }),
      );
      // Рёбра рисуются все, включая задние: сквозные линии дают ощущение
      // стеклянной фигуры, а не плоского треугольника.
      const edges = new THREE.LineSegments(
        new THREE.WireframeGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0x0b3a8f }),
      );
      const group = new THREE.Group();
      group.add(faces, edges);
      // Наклон камеры сверху: при нуле основание не видно.
      // Наклон крупнее, чем в SVG-версии: на 113 пикселях при программной
      // отрисовке рёбра тонкие, и при малом наклоне фигура читается плоским
      // треугольником. Видимое основание возвращает объём.
      group.rotation.x = (30 * Math.PI) / 180;
      scene.add(group);

      const START = (18 * Math.PI) / 180;
      const PER_SECOND = (28 * Math.PI) / 180;

      const renderAt = (time) => {
        group.rotation.y = START + time * PER_SECOND;
        renderer.render(scene, camera);
      };

      window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>

    <script>
      /**
       * Один приостановленный таймлайн — контракт движка.
       *
       * Видимость самих .clip держит фреймворк по data-start/data-duration;
       * анимировать их нельзя, lint отклонит. Поэтому появление рисуется на
       * внутренних узлах: панель всплывает, а уходит заранее, до конца
       * своего окна, чтобы срез не читался как рывок.
       */
      const tl = gsap.timeline({ paused: true });

      const CARDS = [
__TIMELINE__
      ];

      for (const c of CARDS) {
        tl.fromTo(
          `#${c.id} .panel`,
          { opacity: 0, yPercent: 16 },
          { opacity: 1, yPercent: 0, duration: 0.42, ease: "power3.out" },
          c.at,
        );
        tl.to(`#${c.id} .panel`, { opacity: 0, duration: 0.3, ease: "power2.in" }, c.out);
      }

      // Плашки: подъём с пружинкой, как spring в Remotion-версии.
      const PLATES = [
__PLATE_TL__
      ];

      for (const p of PLATES) {
        tl.fromTo(
          `#${p.id}`,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" },
          p.at,
        );
        if (p.strike) {
          tl.fromTo(
            `#${p.id} .strike`,
            { width: 0 },
            { width: "calc(100% - 52px)", duration: 0.6, ease: "power2.inOut" },
            p.at + 0.47,
          );
        }
        if (p.out !== null) {
          tl.to(`#${p.id}`, { opacity: 0, duration: 0.3, ease: "power2.in" }, p.out);
        }
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
