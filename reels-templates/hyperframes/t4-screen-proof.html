<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<title>T4 — Сплит со скрин-доказательством</title>
<style>
@font-face{font-family:"CaptionFont";src:url("assets/fonts/Nunito-Black.ttf") format("truetype");font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.cap{position:absolute;left:50%;top:53%;width:86%;text-align:center;opacity:0;z-index:50;
  font:900 68px/1.12 "CaptionFont","Nunito",sans-serif;letter-spacing:-.5px;color:#fff;
  text-shadow:5px 0 0 #15110E,4.3px 2.5px 0 #15110E,2.5px 4.3px 0 #15110E,0 5px 0 #15110E,-2.5px 4.3px 0 #15110E,-4.3px 2.5px 0 #15110E,-5px 0 0 #15110E,-4.3px -2.5px 0 #15110E,-2.5px -4.3px 0 #15110E,0 -5px 0 #15110E,2.5px -4.3px 0 #15110E,4.3px -2.5px 0 #15110E,0 6px 18px rgba(0,0,0,.45)}
#speaker{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;object-position:50% 30%;
  transform-origin:50% 30%;filter:contrast(1.06) saturate(1.08) sepia(.06)}
#screenWrap{position:absolute;left:0;top:995px;width:1080px;height:925px;overflow:hidden;background:#fff;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 160px);mask-image:linear-gradient(to bottom,transparent 0,#000 160px)}
#screenInner{position:absolute;left:0;top:0;width:1080px}
#screenInner img{width:1080px;display:block}
.hl{position:absolute;border:8px solid #FF3B30;border-radius:20px;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="t4-screen" data-start="0" data-duration="12" data-width="1080" data-height="1920">
  <video id="speaker" class="clip" data-start="0" data-duration="12" data-track-index="0" src="assets/speaker.mp4" muted playsinline></video>
  <audio id="voice" class="clip" data-start="0" data-duration="12" data-track-index="1" src="assets/speaker.mp4"></audio>
  <div id="screenWrap" class="clip" data-start="2" data-duration="5" data-track-index="2">
    <div id="screenInner">
      <img src="assets/taobao.png" />
      <!-- рамки: координаты в px скрина, отмасштабированного до ширины 1080 -->
      <div class="hl" id="hl1" style="left:60px;top:520px;width:300px;height:90px"></div>
      <div class="hl" id="hl2" style="left:420px;top:520px;width:300px;height:90px"></div>
    </div>
  </div>
</div>
<script>
// ===== СУБТИТРЫ =====
// WORDS: [слово, начало(с), конец(с)] — вставь из captions.json (скрипт words-from-captions ниже в README)
function paginate(words, maxWords = 4, maxGap = 0.35, maxDur = 1.4) {
  const pages = []; let cur = null;
  for (const [w, s, e] of words) {
    if (!cur || cur.words.length >= maxWords || s - cur.end > maxGap || e - cur.start > maxDur) {
      cur = { words: [], start: s, end: e }; pages.push(cur);
    }
    cur.words.push(w.replace(/[.,!?…:;«»"]/g, "")); cur.end = e;
  }
  return pages;
}
function addCaptions(tl, words) {
  const root = document.getElementById("root");
  paginate(words).forEach((p, i, arr) => {
    const el = document.createElement("div");
    el.className = "cap"; el.textContent = p.words.join(" "); root.appendChild(el);
    gsap.set(el, { xPercent: -50, yPercent: -50 });
    const end = arr[i + 1] ? Math.min(arr[i + 1].start, p.end + 0.25) : p.end + 0.25;
    tl.set(el, { opacity: 1 }, p.start)
      .fromTo(el, { scale: 0.88 }, { scale: 1, duration: 0.18, ease: "back.out(2.5)" }, p.start)
      .set(el, { opacity: 0 }, end);
  });
}
const DEMO_WORDS = "как только появился этот вид спорта китайцы буквально с ума сходят"
  .split(" ").map((w, i) => [w, 0.3 + i * 0.38, 0.3 + (i + 1) * 0.38]);
const COMP = "t4-screen", DURATION = 12;
const SCREEN = { from: 2, to: 7, scrollToPx: 600 };
const HIGHLIGHTS = [ { id: "hl1", at: 3.2 }, { id: "hl2", at: 4.0 } ]; // абсолютное время ролика
const tl = gsap.timeline({ paused: true });
tl.set("#speaker", { height: 1155, scale: 1.12 }, SCREEN.from)
  .to("#screenInner", { y: -SCREEN.scrollToPx, duration: SCREEN.to - SCREEN.from - 0.6, ease: "power2.inOut" }, SCREEN.from + 0.3)
  .set("#speaker", { height: 1920, scale: 1 }, SCREEN.to);
HIGHLIGHTS.forEach(h => {
  tl.fromTo("#" + h.id, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, h.at);
});
addCaptions(tl, DEMO_WORDS);
tl.set({}, {}, DURATION);
window.__timelines = window.__timelines || {};
window.__timelines[COMP] = tl;
</script>
</body>
</html>
